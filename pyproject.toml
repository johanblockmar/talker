[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talker"
version = "0.1.0"
description = "Offline text-to-speech with mood and inflection controls: desktop app and CLI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<2.0",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
# Fast, lightweight, CPU-friendly neural voice. No true emotion model.
kokoro = ["kokoro>=0.9.4", "librosa>=0.10"]
# Expressive neural voice with an emotion-intensity knob and voice cloning.
chatterbox = ["chatterbox-tts>=0.1.7", "librosa>=0.10"]
gui = ["PySide6>=6.6"]
all = ["talker[kokoro,chatterbox,gui]"]
dev = ["pytest>=8"]

[project.scripts]
talker = "talker.cli:main"

[project.gui-scripts]
talker-gui = "talker.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
